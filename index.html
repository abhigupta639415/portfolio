    <!-- Instant Theme Initialization Script (Prevents FOUC / Theme Flash) -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('portfolio-theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            // Default to dark mode when no preference exists or when set to 'dark'
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
